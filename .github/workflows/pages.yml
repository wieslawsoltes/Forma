name: Deploy Forma to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# contents:write is needed only for the initial source import.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Restore and verify original application sources
        if: hashFiles('.bootstrap/source.part-*') != ''
        run: python3 .bootstrap/import.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run document, geometry, and renderer tests
        run: npm test
      - name: Build standalone application
        run: npm run build
      - name: Verify original standalone build
        if: hashFiles('.bootstrap/source.part-*') != ''
        run: echo '032a78a37d1614054d1f57b0bd836e5582fa0d238261ad86bb81abc729239199  forma.html' | sha256sum --check
      - name: Commit expanded editable source and remove transfer archive
        if: hashFiles('.bootstrap/source.part-*') != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .bootstrap
          git add .gitignore BUILD.txt LICENSE README.md build.mjs examples forma.html index.html package.json src style.css tests
          git commit -m 'feat: import complete Forma design editor, WebGPU engine, examples, and tests'
          git push origin HEAD:main
      - name: Prepare static site
        run: |
          mkdir -p _site/examples
          cp forma.html _site/index.html
          cp forma.html _site/forma.html
          cp examples/roam.forma _site/examples/roam.forma
          touch _site/.nojekyll
          printf '{"commit":"%s","run":"%s"}\n' "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" > _site/version.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
